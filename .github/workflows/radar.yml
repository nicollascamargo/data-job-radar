name: Job radar

on:
  schedule:
    - cron: "7 10 * * *"   # 07:07 in Brasília
    - cron: "7 20 * * *"   # 17:07 in Brasília
  workflow_dispatch:       # "Run workflow" button for a manual run

permissions:
  contents: write          # to save data/jobs.db back to the repo

concurrency:
  group: job-radar
  cancel-in-progress: false

jobs:
  radar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Search jobs and notify
        run: python main.py
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}

      - name: Save the jobs already seen
        run: |
          git config user.name "job-radar-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/jobs.db
          git diff --cached --quiet || git commit -m "chore: update seen jobs"
          git push
